server.port=8080
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.upload-dir=${APP_UPLOAD_DIR:./uploads}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:chat;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
app.s3.bucket=${S3_BUCKET:}
app.s3.enabled=${S3_ENABLED:false}
app.auth.enabled=${AUTH_ENABLED:false}
app.auth.issuer-uri=${COGNITO_ISSUER_URI:}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
